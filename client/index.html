<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon e Ícones -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Arte em Ponto" />

    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arte em Ponto" />

    <!-- Windows/Microsoft -->
    <meta name="msapplication-TileColor" content="#C4A668" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Primary Meta Tags (will be overridden by react-helmet-async) -->
    <title>Arte em Ponto - Crochê Feito à Mão</title>
    <meta name="title" content="Arte em Ponto - Crochê Feito à Mão" />
    <meta name="description" content="Loja online de produtos em crochê. Peças únicas feitas com amor e dedicação. Descubra bolsas, roupas, acessórios e decoração em crochê de alta qualidade." />
    <meta name="keywords" content="crochê, bolsas crochê, acessórios crochê, decoração crochê, feito à mão, handmade, Portugal" />
    <meta name="author" content="Arte em Ponto" />
    <meta name="language" content="Portuguese" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#C4A668" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#C4A668" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F2937" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Load Google Fonts asynchronously (non-render-blocking) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap"></noscript>

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
